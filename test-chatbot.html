<!DOCTYPE html>
<html>

<head>
    <title>Chatbot Test</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
        }

        .chat-container {
            border: 1px solid #ccc;
            border-radius: 8px;
            padding: 15px;
            height: 400px;
            overflow-y: auto;
        }

        .message {
            margin: 10px 0;
            padding: 8px 12px;
            border-radius: 18px;
            max-width: 80%;
        }

        .user {
            background: #e3f2fd;
            margin-left: auto;
        }

        .bot {
            background: #f5f5f5;
            margin-right: auto;
        }

        .input-area {
            display: flex;
            margin-top: 15px;
        }

        input {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 20px;
        }

        button {
            padding: 10px 20px;
            background: #0099ff;
            color: white;
            border: none;
            border-radius: 20px;
            margin-left: 10px;
            cursor: pointer;
        }

        <link rel="stylesheet" href="css/cookie-consent.css"><script src="js/cookie-manager.js" defer></script></head><body><h1>Chatbot Test</h1><div class="chat-container" id="chatBody">< !-- Messages will appear here --></div><div class="input-area"><input type="text" id="userInput" placeholder="Type a message..."><button onclick="sendMessage()">Send</button></div><script src="https://unpkg.com/typed.js@2.1.0/dist/typed.umd.js"></script><script> // Simple chatbot simulation

        function sendMessage() {
            const input=document.getElementById('userInput');
            const message=input.value.trim();

            if ( !message) return;

            // Add user message
            addMessage('user', message);
            input.value='';

            // Simulate bot typing with 3 second delay
            setTimeout(()=> {
                    const botResponse=getBotResponse(message);
                    addMessage('bot', botResponse);
                }

                , 3000);
        }

        function addMessage(role, text) {
            const chatBody=document.getElementById('chatBody');
            const messageDiv=document.createElement('div');

            messageDiv.className=`message $ {
                role
            }

            `;

            if (role==='bot') {
                // Create span for Typed.js
                const typedSpan=document.createElement('span');
                messageDiv.appendChild(typedSpan);

                // Initialize Typed.js for animation
                new Typed(typedSpan, {
                    strings: [text],
                    typeSpeed: 30,
                    showCursor: false
                });
        }

        else {
            messageDiv.textContent=text;
        }

        chatBody.appendChild(messageDiv);
        chatBody.scrollTop=chatBody.scrollHeight;
        }

        function getBotResponse(message) {
            const responses= {
                'hello': 'Hi there! How can I help you today?',
                    'how are you': 'I am doing great! Ready to help you find what you need.',
                    'contact': 'You can contact us through our Contact Page. We are here to help!',
                    'products': 'Check out our full product catalog or tell me what you are looking for.'
            }

            ;

            const lowerMsg=message.toLowerCase();

            for (const key in responses) {
                if (lowerMsg.includes(key)) {
                    return responses[key];
                }
            }

            return "I'm sorry, I don't understand that. How can I assist you?";
        }

        // Allow sending with Enter key
        document.getElementById('userInput').addEventListener('keypress', function(e) {
                if (e.key==='Enter') {
                    sendMessage();
                }
            });
        </script></body></html>
